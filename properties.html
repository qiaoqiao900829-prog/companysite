<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="瑞鳳堂株式会社の京都賃貸・売買物件検索">
<title>京都房源｜瑞鳳堂株式会社</title>
<link rel="stylesheet" href="property.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script src="supabase-config.js">
</script>
</head>
<body>
<div id="header">
</div>
<main>
<section class="property-hero">
<div class="property-shell">
<span class="eyebrow">KYOTO PROPERTY SEARCH</span>
<h1 id="page-title">
</h1>
<p id="page-lead">
</p>
<div class="filter-panel">
<div class="field">
<label id="keyword-label">
</label>
<input id="keyword">
</div>
<div class="field">
<label id="school-label">
</label>
<select id="school">
<option value="">
</option>
</select>
</div>
<div class="field">
<label id="station-label">
</label>
<select id="station">
<option value="">
</option>
</select>
</div>
<div class="field">
<label id="max-label">
</label>
<input id="max-price" type="number" min="0" step="10000">
</div>
<button class="button" id="search-button">
</button>
</div>
</div>
</section>
<section class="property-shell">
<div class="results-bar">
<h2 id="results-title">
</h2>
<span class="results-count" id="results-count">
</span>
</div>
<div class="property-grid" id="property-grid">
<div class="loading-state" id="loading">
</div>
</div>
</section>
</main>
<div id="footer">
</div>
<script src="property-common.js">
</script>
<script src="properties.js">
</script>
</body>
</html>
