<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>瑞鳳堂 MONTHLY｜开发预览</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#29262a;background:#fff9fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:20px 5%;border-bottom:1px solid #f0dbe4}header b{color:#aa5778}main{max-width:980px;margin:auto;padding:28px 16px}h1{font-size:clamp(26px,4vw,42px)}.muted{color:#756c73}.card{background:#fff;border:1px solid #ecdce3;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 16px #b8758b0c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8c5cd;border-radius:9px;font:inherit}button{background:#a85275;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f4e9ed}.total{font-size:27px;font-weight:750;color:#a85275}.note{background:#fff2d8;padding:12px;border-radius:9px;font-size:14px}.placeholder{background:#f7edf1;border-radius:12px;padding:34px;text-align:center;color:#806d77}footer{text-align:center;padding:28px;color:#756c73;font-size:13px}</style></head>
<body><header><b>瑞鳳堂株式会社｜ZUIHOUDOU MONTHLY</b></header><main><h1>京都月租住宅</h1><p class="muted">独立1K・1LDK・整栋・单间・合租｜在线费用试算与预约申请</p>
<div class="note"><strong>开发预览：</strong>本页尚未连接正式房源数据库或邮件服务，不展示原有房源、不修改现有照片与资料。下列房型仅用于测试计算器。</div>
<section class="card"><h2>费用试算</h2><div class="grid"><div><label for="unit">测试房型</label><select id="unit"><option value="90000">单间（月租示例 ¥90,000）</option><option value="140000">独立住宅（月租示例 ¥140,000）</option></select></div><div><label for="people">入住人数</label><select id="people"><option value="1">1人</option><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select></div><div><label for="start">入住日期</label><input id="start" type="date"></div><div><label for="end">退房日期</label><input id="end" type="date"></div></div><div id="summary" aria-live="polite"></div></section>
<section class="card"><h2>预约申请（开发中）</h2><p class="muted">正式版将保存申请并通知公司，管理员审核后才签约；提交申请不等于预订成功。</p><div class="grid"><div><label>姓名</label><input disabled placeholder="正式版开放"></div><div><label>邮箱</label><input disabled placeholder="正式版开放"></div></div><label>备注</label><textarea disabled placeholder="正式版开放"></textarea><p><button disabled>发送预约申请（尚未启用）</button></p></section>
<section class="card"><h2>后续接入</h2><div class="placeholder">此处将从现有 Supabase 读取专门的月租房源及图片。旧房源、旧照片不迁移、不修改。</div></section></main><footer>© 瑞鳳堂株式会社 · 开发预览，不接受正式预约</footer>
<script>
const $=id=>document.getElementById(id),yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const MS=86400000;
function calc(){const s=$('start').value,e=$('end').value;let n=NaN;if(s&&e)n=(Date.parse(e+'T00:00:00Z')-Date.parse(s+'T00:00:00Z'))/MS;
if(!Number.isFinite(n)||n<30){$('summary').innerHTML='<p class="note">请选择入住和退房日期，示例最低入住30晚。</p>';return;}
const monthly=Number($('unit').value),p=Number($('people').value),rent=monthly*n/30,utilities=n*(600+(p-1)*500),deposit=100000,fee=9900,total=rent+utilities+fee+deposit;
$('summary').innerHTML='<h3>测试报价（'+n+'晚）</h3><div class="row"><span>租金（示例按30天比例）</span><b>'+yen(rent)+'</b></div><div class="row"><span>水电煤（示例）</span><b>'+yen(utilities)+'</b></div><div class="row"><span>管理费</span><b>¥0</b></div><div class="row"><span>合同手续费（示例）</span><b>'+yen(fee)+'</b></div><div class="row"><span>可退押金（示例）</span><b>'+yen(deposit)+'</b></div><p>预计初期支付：<span class="total">'+yen(total)+'</span></p><p class="muted">这是演示计算，不构成正式报价；每套房源的实际收费规则将在后台单独配置。</p>';}
['unit','people','start','end'].forEach(id=>$(id).addEventListener('change',calc));calc();
</script></body></html>
